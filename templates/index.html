<!DOCTYPE html>
<html lang="en">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
      <title>Vinno | Wine Quality</title>
      <script src="https://cdn.tailwindcss.com"></script>
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
      <style>
            * {
                  font-family: system-ui, -apple-system, 'Segoe UI', 'Inter', sans-serif;
            }

            body {
                  background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
                  min-height: 100vh;
            }

            /* compact card style */
            .compact-card {
                  background: rgba(255, 255, 255, 0.05);
                  backdrop-filter: blur(2px);
                  border: 1px solid rgba(255, 255, 255, 0.08);
                  border-radius: 1.25rem;
            }

            .input-sm {
                  background: rgba(0, 0, 0, 0.4);
                  border: 1px solid rgba(255, 255, 255, 0.12);
                  border-radius: 0.75rem;
                  padding: 0.5rem 0.75rem;
                  font-size: 0.85rem;
                  transition: all 0.2s;
                  color: #f0f0f0;
            }

            .input-sm:focus {
                  outline: none;
                  border-color: #a855f7;
                  box-shadow: 0 0 0 2px rgba(168, 85, 247, 0.3);
            }

            .input-sm::placeholder {
                  color: rgba(255, 255, 255, 0.3);
                  font-size: 0.75rem;
            }

            select.input-sm {
                  cursor: pointer;
                  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' fill='%23a855f7' viewBox='0 0 24 24' width='14px' height='14px'><path d='M7 10l5 5 5-5z'/></svg>");
                  background-repeat: no-repeat;
                  background-position: right 0.75rem center;
                  appearance: none;
            }

            .btn-predict {
                  background: linear-gradient(95deg, #8b5cf6, #db2777);
                  border: none;
                  padding: 0.6rem;
                  font-weight: 600;
                  font-size: 0.9rem;
                  border-radius: 0.9rem;
                  transition: all 0.2s;
                  box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
            }

            .btn-predict:hover {
                  transform: scale(0.98);
                  box-shadow: 0 2px 6px rgba(139, 92, 246, 0.4);
            }

            .result-badge {
                  transition: all 0.2s;
            }

            .grid-compact {
                  gap: 0.65rem;
            }

            label {
                  font-size: 0.7rem;
                  font-weight: 500;
                  letter-spacing: 0.3px;
                  color: #c4b5fd;
                  display: flex;
                  align-items: center;
                  gap: 0.25rem;
            }

            .section-title {
                  font-size: 0.8rem;
                  font-weight: 700;
                  letter-spacing: -0.2px;
            }

            hr {
                  border-color: rgba(255, 255, 255, 0.08);
            }

            .quality-chip {
                  display: inline-flex;
                  align-items: center;
                  gap: 8px;
                  padding: 0.35rem 1rem;
                  border-radius: 2rem;
                  font-weight: bold;
                  font-size: 0.85rem;
            }

            /* animations */
            @keyframes slideUp {
                  from {
                        opacity: 0;
                        transform: translateY(10px);
                  }

                  to {
                        opacity: 1;
                        transform: translateY(0);
                  }
            }

            .animate-result {
                  animation: slideUp 0.3s ease;
            }
      </style>
</head>

<body class="p-3 flex items-center justify-center min-h-screen">

      <div class="w-full max-w-3xl mx-auto">
            <!-- tiny header compact -->
            <div class="flex items-center justify-between mb-2 px-1">
                  <div class="flex items-center gap-2">
                        <i class="fas fa-wine-bottle text-purple-400 text-xl"></i>
                        <h1 class="text-white font-bold text-lg tracking-tight">Vinno<span
                                    class="text-purple-300">Predict</span></h1>
                        <span class="bg-purple-500/20 text-[10px] text-purple-300 px-2 py-0.5 rounded-full">ML</span>
                  </div>
                  <div class="text-[10px] text-purple-300/50"><i class="fas fa-microchip mr-1"></i>v2.0</div>
            </div>

            <!-- main compact card -->
            <div class="compact-card overflow-hidden shadow-xl">
                  <!-- slim header -->
                  <div class="bg-gradient-to-r from-purple-800/50 to-pink-800/50 px-4 py-2 border-b border-white/10">
                        <div class="flex items-center justify-between">
                              <div class="flex items-center gap-2">
                                    <i class="fas fa-chart-line text-purple-200 text-sm"></i>
                                    <span class="text-white text-xs font-medium">wine characteristics</span>
                              </div>
                              <span class="text-[9px] text-purple-200/60">all fields required</span>
                        </div>
                  </div>

                  <form id="predictionForm" class="p-3 space-y-3">
                        <!-- row 1: wine type + alcohol (side by side compact) -->
                        <div class="grid grid-cols-2 gap-2">
                              <div class="bg-black/20 rounded-xl p-2">
                                    <label><i class="fas fa-wine-glass-alt text-[11px]"></i> Wine type</label>
                                    <select name="wine_type" class="input-sm w-full mt-1 text-sm">
                                          <option value="1" class="bg-gray-800">🍷 Red</option>
                                          <option value="0" class="bg-gray-800">🥂 White</option>
                                    </select>
                              </div>
                              <div class="bg-black/20 rounded-xl p-2">
                                    <label><i class="fas fa-percent text-[11px]"></i> Alcohol %</label>
                                    <input type="number" name="alcohol" step="0.1" min="8" max="15" value="11.5"
                                          class="input-sm w-full mt-1" required>
                              </div>
                        </div>

                        <!-- acidity trio: compact 3 col -->
                        <div class="bg-black/20 rounded-xl p-2">
                              <label class="mb-1"><i class="fas fa-flask"></i> Acidity (g/L)</label>
                              <div class="grid grid-cols-3 gap-2">
                                    <div>
                                          <input type="number" name="fixed_acidity" step="0.1" value="7.0"
                                                placeholder="Fixed" class="input-sm w-full text-xs" required>
                                          <span class="text-[9px] text-gray-400">fixed</span>
                                    </div>
                                    <div>
                                          <input type="number" name="volatile_acidity" step="0.01" value="0.3"
                                                placeholder="Volatile" class="input-sm w-full text-xs" required>
                                          <span class="text-[9px] text-gray-400">volatile</span>
                                    </div>
                                    <div>
                                          <input type="number" name="citric_acid" step="0.01" value="0.30"
                                                placeholder="Citric" class="input-sm w-full text-xs" required>
                                          <span class="text-[9px] text-gray-400">citric</span>
                                    </div>
                              </div>
                        </div>

                        <!-- sugar & chlorides compact row -->
                        <div class="grid grid-cols-2 gap-2">
                              <div class="bg-black/20 rounded-xl p-2">
                                    <label><i class="fas fa-cube"></i> Residual sugar (g/L)</label>
                                    <input type="number" name="residual_sugar" step="0.1" value="2.0"
                                          class="input-sm w-full mt-1" required>
                              </div>
                              <div class="bg-black/20 rounded-xl p-2">
                                    <label><i class="fas fa-seedling"></i> Chlorides (g/L)</label>
                                    <input type="number" name="chlorides" step="0.001" value="0.05"
                                          class="input-sm w-full mt-1" required>
                              </div>
                        </div>

                        <!-- SO2 compact row -->
                        <div class="grid grid-cols-2 gap-2">
                              <div class="bg-black/20 rounded-xl p-2">
                                    <label><i class="fas fa-wind"></i> Free SO₂ (mg/L)</label>
                                    <input type="number" name="free_sulfur_dioxide" step="1" value="30"
                                          class="input-sm w-full mt-1" required>
                              </div>
                              <div class="bg-black/20 rounded-xl p-2">
                                    <label><i class="fas fa-smog"></i> Total SO₂ (mg/L)</label>
                                    <input type="number" name="total_sulfur_dioxide" step="1" value="100"
                                          class="input-sm w-full mt-1" required>
                              </div>
                        </div>

                        <!-- density, pH, sulphates compact triple -->
                        <div class="bg-black/20 rounded-xl p-2">
                              <label class="mb-1"><i class="fas fa-atom"></i> Physico-chemical</label>
                              <div class="grid grid-cols-3 gap-2">
                                    <div>
                                          <input type="number" name="density" step="0.0001" value="0.9950"
                                                placeholder="Density" class="input-sm w-full text-xs" required>
                                          <span class="text-[9px] text-gray-400">g/cm³</span>
                                    </div>
                                    <div>
                                          <input type="number" name="pH" step="0.01" value="3.20" placeholder="pH"
                                                class="input-sm w-full text-xs" required>
                                          <span class="text-[9px] text-gray-400">pH</span>
                                    </div>
                                    <div>
                                          <input type="number" name="sulphates" step="0.01" value="0.60"
                                                placeholder="Sulphates" class="input-sm w-full text-xs" required>
                                          <span class="text-[9px] text-gray-400">g/L</span>
                                    </div>
                              </div>
                        </div>

                        <!-- predict button compact -->
                        <button type="submit" id="predictBtn"
                              class="btn-predict w-full text-white flex items-center justify-center gap-2">
                              <i class="fas fa-magic text-xs"></i> <span>Predict quality</span> <i
                                    class="fas fa-chevron-right text-[10px]"></i>
                        </button>
                  </form>

                  <!-- result container compact -->
                  <div id="resultContainer" class="hidden border-t border-white/10 bg-black/30 p-3">
                        <div id="qualityDisplay" class="text-center"></div>
                        <p class="text-[10px] text-gray-400 text-center mt-1"><i class="fas fa-chart-line"></i> AI
                              inference</p>
                  </div>
            </div>

            <div class="text-center text-[9px] text-gray-500 mt-3 flex justify-center gap-3">
                  <span>⚡ 11 parameters</span>
                  <span>🍇 precision model</span>
                  <span>🔮 real-time</span>
            </div>
      </div>

      <script>
            // ============================================================
            // ABSOLUTELY IDENTICAL LOGIC - only UI compact, but same functionality
            // Original endpoint, data collection, error handling, quality mapping
            // ============================================================
            (function () {
                  const form = document.getElementById('predictionForm');
                  const resultContainer = document.getElementById('resultContainer');
                  const qualityDisplayDiv = document.getElementById('qualityDisplay');
                  const submitBtn = document.getElementById('predictBtn');
                  let originalBtnText = submitBtn.innerHTML;

                  // identical displayResult function based on original thresholds (quality >=7 excellent, >=6 good, >=5 average, else poor)
                  function displayResult(quality) {
                        let score = parseFloat(quality);
                        if (isNaN(score)) score = 5.0;

                        let qualityClass = '';
                        let qualityLabel = '';
                        let emojiIcon = '';
                        let bgStyle = '';
                        let detailMsg = '';

                        // exact same thresholds as original code
                        if (score >= 7) {
                              qualityClass = 'quality-excellent';
                              qualityLabel = 'Excellent';
                              emojiIcon = '🏆';
                              bgStyle = 'background: linear-gradient(115deg, #10b981, #059669);';
                              detailMsg = 'Premium vintage quality';
                        } else if (score >= 6) {
                              qualityClass = 'quality-good';
                              qualityLabel = 'Good';
                              emojiIcon = '👍';
                              bgStyle = 'background: linear-gradient(115deg, #3b82f6, #2563eb);';
                              detailMsg = 'Well above average';
                        } else if (score >= 5) {
                              qualityClass = 'quality-average';
                              qualityLabel = 'Average';
                              emojiIcon = '✓';
                              bgStyle = 'background: linear-gradient(115deg, #f59e0b, #d97706);';
                              detailMsg = 'Standard table wine';
                        } else {
                              qualityClass = 'quality-poor';
                              qualityLabel = 'Below Average';
                              emojiIcon = '⚠️';
                              bgStyle = 'background: linear-gradient(115deg, #ef4444, #dc2626);';
                              detailMsg = 'Needs improvement';
                        }

                        // compact but complete result card
                        qualityDisplayDiv.innerHTML = `
                    <div class="animate-result rounded-xl overflow-hidden shadow-md">
                        <div style="${bgStyle}" class="px-3 py-2 flex justify-between items-center">
                            <div class="flex items-center gap-2">
                                <span class="text-white text-lg">${emojiIcon}</span>
                                <span class="text-white font-bold text-sm">${qualityLabel}</span>
                            </div>
                            <div class="bg-black/40 rounded-full px-3 py-0.5">
                                <span class="text-white font-mono font-bold text-base">${score.toFixed(1)}<span class="text-[10px]">/10</span></span>
                            </div>
                        </div>
                        <div class="bg-white/5 p-2 flex justify-between items-center text-xs">
                            <span class="text-purple-200"><i class="fas fa-star mr-1"></i> ${detailMsg}</span>
                            <span class="text-gray-300 text-[10px]">quality score</span>
                        </div>
                    </div>
                `;
                        resultContainer.classList.remove('hidden');
                        resultContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                  }

                  // submit handler: identical fetch, payload, error handling
                  form.addEventListener('submit', async function (e) {
                        e.preventDefault();

                        // Collect all fields as float (exactly original)
                        const formData = new FormData(form);
                        const data = {};
                        formData.forEach((value, key) => {
                              data[key] = parseFloat(value);
                        });

                        // loading state
                        const originalInner = submitBtn.innerHTML;
                        submitBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> analyzing...';
                        submitBtn.disabled = true;

                        try {
                              // same API endpoint as original
                              const response = await fetch("http://127.0.0.1:8000/predict", {
                                    method: "POST",
                                    headers: {
                                          "Content-Type": "application/json"
                                    },
                                    body: JSON.stringify(data)
                              });

                              if (!response.ok) {
                                    throw new Error(`HTTP ${response.status}`);
                              }

                              const result = await response.json();
                              // original logic uses result.quality or result.prediction
                              const predicted = (result.quality !== undefined) ? result.quality : result.prediction;
                              if (predicted === undefined) throw new Error("Invalid response");
                              displayResult(predicted);

                        } catch (error) {
                              console.error("Prediction error:", error);
                              alert("❌ Cannot reach prediction server.\nMake sure backend is running at http://127.0.0.1:8000");
                        } finally {
                              submitBtn.innerHTML = originalInner;
                              submitBtn.disabled = false;
                        }
                  });
            })();
      </script>
</body>

</html>
