artifacts_root: artifacts

data_ingestion:
  root_dir: artifacts/data_ingestion
  source_url: "https://github.com/HimmatMagar/datae/raw/refs/heads/main/wine-qualities.zip"
  local_data_file: artifacts/data_ingestion/data.zip
  unzip_dir: artifacts/data_ingestion/

data_validation:
  root_dir: artifacts/data_validation
  unzip_data_dir: artifacts/data_ingestion/wine-quality.csv
  STATUS_FILE: artifacts/data_validation/status.txt

data_transformation:
  root_dir: artifacts/data_transformation
  data_file: artifacts/data_ingestion/wine-quality.csv

model_trainer:
  root_dir: artifacts/model_trainer
  train_data: artifacts/data_transformation/x_train.pkl
  test_data: artifacts/data_transformation/y_train.pkl
  model: model.joblib

model_evaluation:
  root_dir: artifacts/model_evluation
  xval_data: artifacts/data_transformation/x_val.pkl
  yval_data: artifacts/data_transformation/y_val.pkl
  model_path: artifacts/model_trainer/model.joblib
  metric_file_name: artifacts/model_evluation/metrics.json
